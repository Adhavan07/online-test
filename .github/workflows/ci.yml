name: TechScreen Pro CI/CD Pipeline

on:
  push:
    branches: [main, master, ui-redesign]
  pull_request:
    branches: [main, master, ui-redesign]

jobs:
  test-and-build:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: techscreen_pro
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Python 3 (For Sandboxed Code Runner)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate --schema=server/src/prisma/schema.prisma

      - name: Push Database Schema
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/techscreen_pro?schema=public
        run: npm run db:push

      - name: Seed Database
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/techscreen_pro?schema=public
          JWT_SECRET: techscreen-ci-testing-secret-key-32-chars-long
        run: npm run db:seed

      - name: Run Full Automated Test Suite (Vitest)
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/techscreen_pro?schema=public
          JWT_SECRET: techscreen-ci-testing-secret-key-32-chars-long
          NODE_ENV: test
        run: npm test

      - name: Build Server & Client Bundles
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: techscreen-pro:ci-test
